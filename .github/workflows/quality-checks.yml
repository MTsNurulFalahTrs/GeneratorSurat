name: Quality Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Syntax, tests, and dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript syntax and tests
        run: npm run check

      - name: Measure coverage for application, templates, and PDF API
        run: npm run test:coverage

      - name: Upload code coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generator-surat-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Audit production and development dependencies
        run: npm audit --audit-level=moderate
